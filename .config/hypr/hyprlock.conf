background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 2
    blur_size = 8
    contrast = 0.9
    brightness = 0.95
    vibrancy = 0.17
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.3
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2eee)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i>$FAIL</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(cdd6f4ff)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(bac2deff)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi $USER
    color = rgba(cba6f7ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Italic
    position = 0, -20
    halign = center
    valign = center
}

# click to log out
label {
    monitor =
    text = 󰍃  Log out / switch session
    color = rgba(cdd6f4ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
    onclick = hyprctl dispatch exit
}
